<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Khor DS Elite — Figma v9.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #E04D36;
            --brand-navy: #051758;
            --brand-gradient: linear-gradient(135deg, #FF6B53 0%, #E04D36 100%);
            --bg-deep: #09090B;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #FFFFFF;
            --text-muted: #A1A1AA;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-deep); color: var(--text-main); overflow: hidden; height: 100vh; }
        .app-container { padding: 16px; display: flex; flex-direction: column; gap: 14px; height: 100%; }

        /* Header */
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
        .logo-group { display: flex; align-items: center; gap: 10px; }
        .logo-box { width: 32px; height: 32px; background: var(--brand-gradient); border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(224, 77, 54, 0.3); }
        .title-group h1 { font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-v { font-size: 9px; padding: 2px 6px; background: rgba(255,255,255,0.08); border-radius: 4px; color: var(--text-muted); }

        /* Tabs */
        .tabs { display: flex; gap: 4px; margin-bottom: 4px; overflow-x: auto; padding-bottom: 4px; }
        .tab { padding: 6px 10px; font-size: 10px; font-weight: 600; cursor: pointer; border-radius: 6px; white-space: nowrap; background: var(--glass-bg); color: var(--text-muted); border: 1px solid transparent; transition: 0.2s; }
        .tab.active { background: var(--brand-navy); color: white; border-color: rgba(255,255,255,0.2); }

        /* Content List */
        .section-title { font-size: 10px; font-weight: 600; color: #52525B; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        #content { flex: 1; overflow-y: auto; padding-right: 4px; }
        .component-item { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s; }
        .component-item:hover { transform: translateX(4px); border-color: var(--brand-primary); background: rgba(224, 77, 54, 0.05); }
        .component-info span { font-size: 9px; color: var(--brand-primary); font-weight: 700; text-transform: uppercase; }
        .component-info h4 { font-size: 12px; font-weight: 600; margin-top: 2px; }

        /* Buttons */
        button { cursor: pointer; border: none; border-radius: 8px; font-weight: 600; font-size: 11px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-insert { background: var(--brand-navy); color: white; padding: 6px 12px; border: 1px solid rgba(255,255,255,0.1); }
        .btn-insert:hover { background: #0a258c; }
        
        .btn-action { flex: 1; padding: 12px; border-radius: 10px; }
        .btn-primary { background: var(--brand-gradient); color: white; }
        .btn-secondary { background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-main); }
        .btn-nuke { width: auto; font-size: 10px; padding: 4px 8px; color: var(--danger); background: transparent; border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 6px; }

        /* Footer */
        .footer { padding-top: 12px; border-top: 1px solid var(--glass-border); display: flex; flex-direction: column; gap: 10px; }
        .status-row { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--text-muted); }
        .btn-row { display: flex; gap: 8px; }

        /* Tooltip-like Toast */
        #toast { position: fixed; top: 16px; left: 16px; right: 16px; background: #27272A; border: 1px solid var(--glass-border); color: white; padding: 10px; border-radius: 8px; font-size: 11px; text-align: center; display: none; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo-group">
                <div class="logo-box">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                </div>
                <div class="title-group">
                    <h1>Khor Design System</h1>
                    <div style="font-size: 9px; color: var(--text-muted);">Elite Automation v9.0</div>
                </div>
            </div>
            <div class="badge-v">FIGMA NATIVE</div>
        </div>

        <div class="controls">
            <div class="tabs" id="category-tabs">
                <div class="tab active" data-cat="all">Todos</div>
                <div class="tab" data-cat="atom">Átomos</div>
                <div class="tab" data-cat="molecule">Moléculas</div>
                <div class="tab" data-cat="organism">Organismos</div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
                <div class="section-title">Componentes</div>
                <button class="btn-nuke" onclick="nukeTokens()">Borrar Tokens Locales</button>
            </div>
        </div>

        <div id="content"></div>

        <div class="footer">
            <div class="status-row">
                <span>● Ecosistema Conectado</span>
                <span id="comp-count">0 comps</span>
            </div>
            <div class="btn-row">
                <button class="btn-action btn-secondary" onclick="syncTokens()">🔄 Sincronizar</button>
                <button class="btn-action btn-primary" onclick="khorify()">✨ Magic Khor-ify</button>
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="btn-action btn-secondary" onclick="generateDoc()" style="flex: 2; border-color: rgba(224, 77, 54, 0.3); color: var(--brand-primary);">
                    📄 Generar Documentación (Full Grid)
                </button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        let allComponents = []; currentFilter = 'all'; selectedComp = null;

        window.onmessage = (event) => {
            const msg = event.data.pluginMessage;
            if (msg.type === 'sync-data') { 
                allComponents = msg.data.components; 
                document.getElementById('comp-count').innerText = allComponents.length + ' comps';
                renderList(); 
            }
            if (msg.type === 'notify') showToast(msg.message);
        };

        const renderList = () => {
            const container = document.getElementById('content');
            const filtered = allComponents.filter(c => currentFilter === 'all' || c.category === currentFilter);
            container.innerHTML = filtered.map(c => `
                <div class="component-item" onclick="selectComp('${c.name}')">
                    <div class="component-info">
                        <span>${c.category}</span>
                        <h4>${c.name}</h4>
                    </div>
                    <button class="btn-insert" onclick="insertComp('${c.name}', event)">Inyectar</button>
                </div>
            `).join('');
        };

        window.selectComp = (name) => {
            selectedComp = name;
            showToast(`Seleccionado: ${name}`);
            document.querySelectorAll('.component-item').forEach(el => {
                el.style.borderColor = el.querySelector('h4').innerText === name ? 'var(--brand-primary)' : 'var(--glass-border)';
            });
        };

        window.insertComp = (name, e) => {
            if (e) e.stopPropagation();
            const comp = allComponents.find(c => c.name === name);
            parent.postMessage({ pluginMessage: { type: 'insert-component', component: comp } }, '*');
        };

        window.generateDoc = () => {
            if (!selectedComp) { showToast("⚠️ Selecciona un componente de la lista primero."); return; }
            const comp = allComponents.find(c => c.name === selectedComp);
            parent.postMessage({ pluginMessage: { type: 'generate-doc', component: comp } }, '*');
        };

        window.syncTokens = () => parent.postMessage({ pluginMessage: { type: 'sync-tokens' } }, '*');
        window.khorify = () => parent.postMessage({ pluginMessage: { type: 'khorify-selection' } }, '*');
        window.nukeTokens = () => {
            if (confirm("⚠️ ¿Purger todas las variables 'Khor Tokens'?")) {
                parent.postMessage({ pluginMessage: { type: 'nuke-tokens' } }, '*');
            }
        };

        document.querySelectorAll('.tab').forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.cat;
                renderList();
            }
        });

        function showToast(txt) {
            const t = document.getElementById('toast');
            t.innerText = txt; t.style.display = "block";
            setTimeout(() => t.style.display = "none", 3000);
        }
    </script>
</body>
</html>
