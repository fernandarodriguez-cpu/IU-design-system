<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        :root {
            --primary: #E04D36; --navy: #051758; --bg: #ffffff;
            --text: #333333; --muted: #666666; --border: #e6e6e6; --hover: #f5f5f5;
            --danger: #DC4446;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0; background: var(--bg); color: var(--text);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        
        .header { padding: 12px 16px; background: var(--navy); color: white; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .header h1 { font-size: 13px; margin: 0; font-weight: 700; }
        .version { font-size: 10px; opacity: 0.6; }

        .controls { padding: 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        input[type="text"] { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; outline: none; }
        
        .tabs { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; padding-bottom: 4px; }
        .tab { padding: 6px 10px; font-size: 10px; font-weight: 600; cursor: pointer; border-radius: 4px; white-space: nowrap; background: var(--hover); color: var(--muted); border: 1px solid transparent; }
        .tab.active { background: #fff; color: var(--primary); border-color: var(--primary); }

        #content { flex: 1; overflow-y: auto; padding: 4px 0; }
        .component-item { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .component-item:hover { background: var(--hover); }
        .component-info { flex: 1; overflow: hidden; margin-right: 8px; }
        .component-info h4 { margin: 0; font-size: 12px; font-weight: 600; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .component-info span { font-size: 10px; color: var(--muted); text-transform: uppercase; }
        
        .btn-insert { background: var(--navy); color: white; border: none; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
        .btn-insert:hover { opacity: 0.9; }

        /* Prop Configurator */
        .prop-config { margin-bottom: 12px; }
        .prop-config label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; }
        .prop-select { width: 100%; padding: 6px; font-size: 11px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 8px; }

        #details { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: white; padding: 16px; z-index: 100; overflow-y: auto; }
        .back-btn { color: var(--primary); font-size: 12px; cursor: pointer; margin-bottom: 12px; display: inline-block; font-weight: 600; }

        .footer { padding: 12px; border-top: 1px solid var(--border); background: #fafafa; display: flex; flex-direction: column; gap: 8px; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--muted); margin-bottom: 4px; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; display: inline-block; margin-right: 4px; }

        .btn-group { display: flex; gap: 8px; }
        .btn-action { flex: 1; padding: 10px; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 4px; }
        .btn-sync { background: var(--primary); color: white; }
        .btn-nuke { background: #fee2e2; color: var(--danger); border: 1px solid #fecaca; }
        .btn-extract { background: #f3f4f6; color: var(--muted); border: 1px solid var(--border); }

        /* Extraction View */
        #extraction-view {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: white; z-index: 200; padding: 16px; flex-direction: column;
        }
        #extraction-result {
            flex: 1; width: 100%; margin: 12px 0; font-family: monospace; font-size: 10px;
            padding: 10px; background: #f8f8f8; border: 1px solid var(--border); border-radius: 4px;
            resize: none;
        }
        
        #debug-log { font-size: 9px; color: #888; padding: 8px; max-height: 80px; overflow-y: auto; background: #f5f5f5; border-top: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="header">
        <h1>KHOR DS — v7.3</h1>
        <span class="version">ESTABILIZACIÓN</span>
    </div>

    <div class="controls">
        <input type="text" id="search" placeholder="Buscar entre 113 componentes...">
        <div class="tabs" id="category-tabs">
            <div class="tab active" data-cat="all">Todos</div>
            <div class="tab" data-cat="atom">Átomos</div>
            <div class="tab" data-cat="molecule">Moléculas</div>
            <div class="tab" data-cat="organism">Organismos</div>
            <div class="tab" data-cat="pattern">Patrones</div>
        </div>
    </div>

    <div id="content"></div>

    <div id="details">
        <span class="back-btn" id="back-to-list">← Volver al listado</span>
        <h2 id="detail-name" style="margin-top:0; font-size: 18px; color: var(--navy);">Component</h2>
        <div id="props-list" style="font-size: 11px; color: var(--muted); margin-bottom: 20px;"></div>
        <button id="insert-from-detail" class="btn-insert" style="width: 100%; padding: 14px;">🚀 Insertar en Figma</button>
    </div>

    <div id="extraction-view">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin:0; font-size: 14px;">📦 Auditoría Khor Bidireccional</h3>
            <span class="back-btn" id="close-extraction" style="margin:0;">Cerrar</span>
        </div>
        <textarea id="extraction-result" readonly placeholder="Resultados..."></textarea>
        <button id="copy-json-btn" class="btn-insert" style="width:100%; padding:14px;">Copiar JSON</button>
    </div>

    <div class="footer">
        <div class="status-bar">
            <span><span class="status-dot"></span>Ecosistema Conectado</span>
            <span id="comp-count">0 comps</span>
        </div>
        <div class="btn-group">
            <button id="nuke-btn" class="btn-action btn-nuke" title="Borra las colecciones antiguas">🧹 Nuke</button>
            <button id="sync-btn" class="btn-action btn-sync">🔄 Sync Default</button>
            <button id="import-manifest-btn" class="btn-action" style="background: #7C3AED; color: white;">📦 Import Manifest</button>
            <button id="khorify-btn" class="btn-action" style="background: linear-gradient(135deg, #E04D36, #051758); color: white;">✨ Khor-ify</button>
            <button id="show-extract-btn" class="btn-action btn-extract">🔍 Extraer</button>
        </div>
        <input type="file" id="manifest-file" style="display: none;" accept=".json">
    </div>

    <div id="debug-log"><strong>Debug Log:</strong><br/></div>

    <script>
        let allComponents = []; currentFilter = 'all'; searchQuery = '';

        window.onmessage = (event) => {
            const msg = event.data.pluginMessage;
            if (!msg) return;
            
            log(`Mensaje recibido: ${msg.type}`);

            if (msg.type === 'sync-data') { 
                if (!msg.data || !msg.data.components) {
                    log('Error: Metadata de componentes vacía');
                    return;
                }
                allComponents = msg.data.components; 
                document.getElementById('comp-count').innerText = allComponents.length + ' comps';
                log(`Sincronizados ${allComponents.length} componentes`);
                renderList(); 
            }
            if (msg.type === 'log') log(msg.message);
            if (msg.type === 'display-json') {
                document.getElementById('extraction-result').value = msg.data;
                document.getElementById('extraction-view').style.display = 'flex';
            }
        };

        function log(msg) {
            const logEl = document.getElementById('debug-log');
            if (logEl) {
                logEl.innerHTML += '• ' + msg + '<br/>'; 
                logEl.scrollTop = logEl.scrollHeight;
            }
            console.log(`[Khor Plugin] ${msg}`);
        }

        // Handlers
        document.getElementById('nuke-btn').onclick = () => {
            if(confirm("⚠️ ¿Purger todas las colecciones 'Khor Tokens'?") ) {
                parent.postMessage({ pluginMessage: { type: 'nuke-tokens' } }, '*');
            }
        };
        document.getElementById('sync-btn').onclick = () => parent.postMessage({ pluginMessage: { type: 'sync-tokens' } }, '*');
        
        const manifestBtn = document.getElementById('import-manifest-btn');
        const fileInput = document.getElementById('manifest-file');
        
        manifestBtn.onclick = () => fileInput.click();
        
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const manifest = JSON.parse(event.target.result);
                    log("📦 Manifiesto cargado. Enviando a Khor Engine...");
                    parent.postMessage({ pluginMessage: { type: 'import-manifest', manifest } }, '*');
                } catch (err) {
                    log("❌ Error al leer manifiesto: " + err.message);
                }
            };
            reader.readAsText(file);
        };

        document.getElementById('khorify-btn').onclick = () => parent.postMessage({ pluginMessage: { type: 'khorify-selection' } }, '*');
        document.getElementById('show-extract-btn').onclick = () => parent.postMessage({ pluginMessage: { type: 'extract-library' } }, '*');
        document.getElementById('close-extraction').onclick = () => document.getElementById('extraction-view').style.display = 'none';
        
        document.getElementById('copy-json-btn').onclick = () => {
            const area = document.getElementById('extraction-result');
            area.select(); document.execCommand('copy'); alert('📋 JSON copiado');
        };

        // Tabs logic
        document.querySelectorAll('.tab').forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.cat;
                renderList();
            }
        });

        function renderList() {
            const container = document.getElementById('content');
            const filtered = allComponents.filter(c => (currentFilter === 'all' || c.category === currentFilter) && c.name.toLowerCase().includes(searchQuery.toLowerCase()));
            container.innerHTML = filtered.map(c => `
                <div class="component-item" data-name="${c.name}">
                    <div class="component-info">
                        <span>${c.category}</span>
                        <h4>${c.name}</h4>
                    </div>
                    <button class="btn-insert" onclick="insertComponent('${c.name}', event)">Insertar</button>
                </div>
            `).join('');
            
            document.querySelectorAll('.component-item').forEach(item => item.addEventListener('click', () => {
                const comp = allComponents.find(c => c.name === item.dataset.name);
                showDetail(comp);
            }));
        }

        let currentComp = null;
        function showDetail(comp) {
            currentComp = comp;
            document.getElementById('detail-name').innerText = comp.name;
            const propsList = document.getElementById('props-list');
            
            // Render basic props info + selectors for variants
            let html = '<div style="margin-bottom: 12px;">';
            
            // Only show prop selectors for props with options
            const configurableProps = comp.props.filter(p => p.options && p.options.length > 0);
            
            if (configurableProps.length > 0) {
                html += '<div class="section-title" style="font-size: 10px; font-weight: 700; margin-bottom: 8px; border-bottom: 1px solid #eee;">CONFIGURACIÓN</div>';
                configurableProps.forEach(p => {
                    html += `
                        <div class="prop-config">
                            <label>${p.name}</label>
                            <select class="prop-select" data-prop="${p.name}">
                                ${p.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                            </select>
                        </div>
                    `;
                });
            }
            
            html += '</div>';
            
            // List all other props as info
            html += '<div class="section-title" style="font-size: 10px; font-weight: 700; margin-bottom: 4px;">TODOS LOS ARGS</div>';
            html += comp.props.map(p => `<span style="opacity: 0.6">• ${p.name}: ${p.type}</span>`).join('<br/>');
            
            propsList.innerHTML = html;
            document.getElementById('details').style.display = 'block';
            
            document.getElementById('insert-from-detail').onclick = () => {
                const selectedProps = {};
                document.querySelectorAll('.prop-select').forEach(select => {
                    selectedProps[select.dataset.prop] = select.value;
                });
                insertComponent(comp.name, null, selectedProps);
            };
        }

        document.getElementById('back-to-list').onclick = () => document.getElementById('details').style.display = 'none';
        
        function insertComponent(name, event, overrides = {}) { 
            if (event) event.stopPropagation(); 
            const comp = allComponents.find(c => c.name === name); 
            if (!comp) return;
            
            log(`Insertando ${name}...`);
            parent.postMessage({ pluginMessage: { 
                type: 'insert-component', 
                component: comp,
                overrides: overrides 
            } }, '*'); 
        }
        document.getElementById('search').addEventListener('input', (e) => { searchQuery = e.target.value; renderList(); });

        parent.postMessage({ pluginMessage: { type: 'ui-ready' } }, '*');
    </script>
</body>
</html>
